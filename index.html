<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Dashboard</title>
  
  <style>
    /* Reset & Base Fonts */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f9fafb;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      width: 100%;
      max-width: 420px;
    }

    /* Card Layout */
    .financial-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .dashboard-context-bar {
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 8px;
    }

    .context-label {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #6366f1;
      text-transform: uppercase;
    }

    /* Header */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-icon.savings-icon {
      background-color: #eef2ff;
      color: #4f46e5;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-label {
      font-size: 0.875rem;
      color: #6b7280;
      font-weight: 500;
      display: block;
    }

    .card-amount {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-top: 2px;
    }

    /* Badges */
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .success-badge {
      background-color: #ecfdf5;
      color: #059669;
    }

    .warning-badge {
      background-color: #fffbe completed;
      color: #d97706;
    }

    /* Progress Section */
    .card-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .target-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8125rem;
      color: #4b5563;
    }

    .progress-percent {
      font-weight: 700;
      color: #4f46e5;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background-color: #f3f4f6;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 999px;
      transition: width 0.4s ease-in-out;
    }

    /* Footer */
    .card-footer {
      border-top: 1px solid #f3f4f6;
      padding-top: 12px;
      font-size: 0.8125rem;
      color: #6b7280;
    }

    .footer-meta strong {
      color: #111827;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="financial-card savings-card">
      <div class="dashboard-context-bar">
        <span class="context-label">PERSONAL FINANCE DASHBOARD</span>
      </div>

      <div class="card-header">
        <div class="card-title-group">
          <div class="card-icon savings-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-3.5c1-.5 2.5-1.2 2.5-3.5V7c0-1.1-.9-2-2-2z"/>
              <path d="M16 11h.01"/>
            </svg>
          </div>
          <div>
            <span class="card-label">Total Savings</span>
            <h3 class="card-amount" id="savings-amount">$0.00</h3>
          </div>
        </div>
        <span class="status-badge success-badge" id="savings-status">Calculating...</span>
      </div>

      <div class="card-body">
        <div class="target-info">
          <span>Monthly Target: <strong id="savings-target">$0.00</strong></span>
          <span class="progress-percent" id="savings-percent">0%</span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="savings-progress" style="width: 0%;"></div>
        </div>
      </div>

      <div class="card-footer">
        <span class="footer-meta">Remaining to goal: <strong id="savings-remaining">$0.00</strong></span>
      </div>
    </div>
  </div>

  <script>
    function calculateSavings(income, expenses, targetGoal) {
      const netSavings = Math.max(0, income - expenses);
      const remaining = Math.max(0, targetGoal - netSavings);
      const percentage = Math.min(100, ((netSavings / targetGoal) * 100)).toFixed(1);

      document.getElementById('savings-amount').innerText = `$${netSavings.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
      document.getElementById('savings-target').innerText = `$${targetGoal.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
      document.getElementById('savings-percent').innerText = `${percentage}%`;
      document.getElementById('savings-remaining').innerText = `$${remaining.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

      const progressBar = document.getElementById('savings-progress');
      progressBar.style.width = `${percentage}%`;

      const statusBadge = document.getElementById('savings-status');
      if (percentage >= 100) {
        statusBadge.innerText = 'Goal Reached';
        statusBadge.className = 'status-badge success-badge';
      } else if (percentage >= 70) {
        statusBadge.innerText = 'On Track';
        statusBadge.className = 'status-badge success-badge';
      } else {
        statusBadge.innerText = 'Behind Target';
        statusBadge.className = 'status-badge warning-badge';
      }
    }

    // Initialize values ($5000 Income, $2550 Expenses, $3000 Target)
    calculateSavings(5000, 2550, 3000);
  </script>
</body>
</html>
